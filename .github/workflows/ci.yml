name: CodePulse CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Apply Database Migrations
        run: node database/migrations/migrate.js

      - name: Run Backend Unit & Integration Tests
        working-directory: backend
        run: npm test

      - name: Compile Backend TypeScript
        working-directory: backend
        run: npm run build

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build

      - name: Verify Frontend Artifacts
        run: |
          test -f frontend/dist/index.html || exit 1
          test -f frontend/dist/_headers || exit 1
          test -f frontend/dist/_redirects || exit 1
          echo "All production distribution artifacts validated successfully."
